services:
  # 1. Frontend: React 18 + Vite (Static Site - 100% Free, Global CDN, No Cold Starts)
  - type: static
    name: krishisetu-client
    plan: free
    rootDir: client
    buildCommand: npm install && npm run build
    publishDir: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: krishisetu-server
          property: url
          format: ${url}/api/v1

  # 2. Backend: Node.js + Express + Prisma (Web Service)
  - type: web
    name: krishisetu-server
    env: node
    plan: free
    rootDir: server
    buildCommand: npm install && npx prisma generate
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_ORIGIN
        fromService:
          type: static
          name: krishisetu-client
          property: url
      - key: AI_SERVICE_URL
        fromService:
          type: web
          name: krishisetu-ai
          property: url
      - key: AI_SERVICE_API_KEY
        value: dev-ai-service-key
      - key: WEATHER_PROVIDER
        value: openmeteo

  # 3. AI Microservice: Python FastAPI + Computer Vision (Web Service)
  - type: web
    name: krishisetu-ai
    env: python
    plan: free
    rootDir: ai-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: AI_SERVICE_API_KEY
        value: dev-ai-service-key
